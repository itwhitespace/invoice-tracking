<!doctype html>
<html lang="en">
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<title>APP CORE Tracking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — sticky top bar, persona strip, left nav + main; Try-this drawer on the right. Same tokens as the Process & UX/UI spec. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#151A20; --muted:#59636E; --line:#D5DBE1; --line-2:#E7EBEF;
  --accent:#2350C4; --accent-ink:#FFFFFF; --accent-soft:#E6ECFA; --on-strong:#FFFFFF;
  --ok:#1B7745; --ok-soft:#E2F2E9; --warn:#8F5D06; --warn-soft:#FAEFD8; --crit:#B2352A; --crit-soft:#FAE5E2;
  --apple:#3A3F47; --apple-soft:#E6E8EC; --shadow:rgba(20,26,32,.14); --overlay:rgba(13,16,20,.45);
  --nav:#1B1F3B; --nav-2:#2B3166; --nav-ink:#C9CEE6; --nav-line:rgba(255,255,255,.18);
  --s-na:#7D8795; --s-todo:#B8C0CB; --s-prog:#2F76D6; --s-rev:#8B4FC9; --s-cli:#C96F08; --s-app:#5B6B82; --s-chg:#CF3149; --s-fee:#D13A72; --s-ok:#0E8F55;
  --h-on:#0E8F55; --h-risk:#C96F08; --h-late:#CF3149; --h-done:#0A6B40;
  --g1:#6B5BD2; --g2:#2F76D6; --g3:#0C7FB0; --g4:#0B7F75; --g5:#0E8F55; --g6:#55820A; --g7:#A9650A; --g8:#C23A72;
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1014; --surface:#151A20; --surface-2:#11151A; --ink:#E5E8EC; --muted:#9BA5B0; --line:#2E3540; --line-2:#222830;
  --accent:#86A4FF; --accent-ink:#0D1014; --accent-soft:#1B2643; --on-strong:#0D1014;
  --ok:#5BC68E; --ok-soft:#14281D; --warn:#E3B25A; --warn-soft:#2D2413; --crit:#F27D71; --crit-soft:#331A19;
  --apple:#CDD2D9; --apple-soft:#262B33; --shadow:rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6); --nav:#0F1226; --nav-2:#232A55; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1014; --surface:#151A20; --surface-2:#11151A; --ink:#E5E8EC; --muted:#9BA5B0; --line:#2E3540; --line-2:#222830;
  --accent:#86A4FF; --accent-ink:#0D1014; --accent-soft:#1B2643; --on-strong:#0D1014;
  --ok:#5BC68E; --ok-soft:#14281D; --warn:#E3B25A; --warn-soft:#2D2413; --crit:#F27D71; --crit-soft:#331A19;
  --apple:#CDD2D9; --apple-soft:#262B33; --shadow:rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6); --nav:#0F1226; --nav-2:#232A55; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.005em}
h1{font-size:24px;font-weight:700;line-height:1.2}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.small{font-size:12.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{display:grid;grid-template-columns:repeat(4,5px);gap:2px;align-items:end;height:18px}
.mark i{display:block;background:var(--accent);border-radius:1px}
.mark i:nth-child(1){height:6px}.mark i:nth-child(2){height:10px}.mark i:nth-child(3){height:14px}.mark i:nth-child(4){height:18px;background:var(--line)}
.bn{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap}
.tag{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:100%}
#persona{font-weight:600;color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.crit{background:var(--crit);border-color:var(--crit);color:var(--on-strong)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{position:relative;width:36px;height:34px;padding:0}
.ib svg{width:18px;height:18px}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:var(--on-strong);font:600 11px/18px var(--f-mono);text-align:center;padding:0 4px}
.rs{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600}
.pstrip{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.pstrip .in{max-width:1440px;margin:0 auto;padding-block:8px;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.pstrip b{font-weight:600}
.pstrip .pb{color:var(--muted)}
.side{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;align-self:center}
.side.int{background:var(--surface);color:var(--accent)}
.side.ext{background:var(--ink);color:var(--surface)}

/* shell */
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:176px minmax(0,1fr);gap:24px;padding-block:20px 72px}
.nav{display:flex;flex-direction:column;gap:2px;align-self:start}
.nh{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.nb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border:0;background:transparent;text-align:left;cursor:pointer;font-weight:600;color:var(--muted)}
.nb:hover{color:var(--ink)}
.nb[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.cnt{font:600 11px/1 var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:3px 6px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1180px){ body.try-open .gut.wide{padding-right:396px} }
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:12px 72px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nh{display:none}
  .nb{white-space:nowrap}
  .who > span{display:none}
  #persona{max-width:calc(100vw - 32px)}
}

/* screen header */
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.sh > div{min-width:0}
.eyebrow{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sub{color:var(--muted);margin-top:6px;max-width:68ch}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button svg{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.bar{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.bar label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pbd{padding:14px 16px;display:grid;gap:10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.hint-row{font-size:12.5px;color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);line-height:1.4}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.plain::before{display:none}
.st-in_progress,.st-internal_review,.chip.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st-with_client,.st-awaiting_fee,.h-at_risk,.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st-with_apple,.chip.apple{background:var(--apple-soft);color:var(--apple);border-color:transparent}
.st-changes_requested,.h-delayed,.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.st-signed_off,.h-on_track,.h-completed,.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font:600 10px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.t td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.grp td{background:var(--surface-2);font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px}
.t .tight{white-space:nowrap}
.lnk{border:0;background:none;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-align:left}
.lnk:hover{color:var(--accent);text-decoration:underline}
.sb{display:inline-grid;grid-template-columns:repeat(6,10px);gap:2px;vertical-align:middle;margin-right:6px}
.sb i{height:6px;border-radius:2px;background:var(--line)}
.sb i.d{background:var(--ok)} .sb i.c{background:var(--accent)} .sb i.n{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.upd{max-width:42ch;color:var(--muted);font-size:12.5px}

/* pipeline + kanban */
table.pipe{min-width:1100px;table-layout:fixed}
.pipe th.sc,.pipe td.sc{width:210px}
.pipe th{padding:8px 2px;background:var(--surface-2);text-transform:none;letter-spacing:0;white-space:normal}
.pipe th.sc{padding:8px 12px;text-align:left;vertical-align:bottom;font:600 10px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.07em}
.chev{display:block;padding:9px 16px 9px 12px;color:#fff;font:600 12px/1.2 var(--f-display);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe td{padding:6px 3px}
.pc{display:flex;flex-direction:column;gap:3px;border-radius:8px;padding:8px 10px;min-height:58px;font-size:12px;border:1px solid transparent;width:100%;text-align:left;background:none;cursor:pointer;line-height:1.3;color:inherit}
.pc b{font-weight:600}
.pc.done{background:var(--s-ok);color:#fff}
.pc.cur{color:#fff}
.pc.todo{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line);cursor:default}
.pc.na{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line-2) 6px 12px);color:var(--muted);cursor:default;justify-content:center}
.pc .tchip{display:block;background:#fff;color:#1B1F3B;border-radius:4px;padding:3px 6px;font-weight:600;font-size:11.5px;margin-top:2px}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(212px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{display:flex;flex-direction:column;min-width:0;gap:8px}
.kcol > header{display:flex;gap:8px;align-items:center;padding:10px 14px;color:#fff;font:600 14px/1.2 var(--f-display);border-radius:8px}
.kn{font:600 11px/1 var(--f-mono);opacity:.85}
.kc{margin-left:auto;font:600 12px/1 var(--f-mono);background:rgba(255,255,255,.25);border-radius:9px;padding:3px 8px}
.kcards{padding:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:8px;min-height:180px;flex:1}
.kcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bar,var(--line));border-radius:8px;padding:10px 12px;cursor:pointer;width:100%;box-shadow:0 1px 2px var(--shadow)}
.kcard:hover{border-color:var(--accent);border-left-color:var(--bar,var(--accent))}
.kcard b{font-weight:600;line-height:1.3}
.kcard .small{line-height:1.35}
.kempty{color:var(--muted);font-size:12px;padding:12px 4px;text-align:center}

/* project page */
.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tk{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.tk .tn{font:600 10.5px/1 var(--f-mono);color:var(--muted)}
.tk .tl{font-weight:600;font-size:12.5px;line-height:1.25;overflow-wrap:anywhere}
.tk .ts{font-size:11.5px;color:var(--muted);line-height:1.3}
.tk.d{background:var(--ok-soft);border-color:transparent}
.tk.d .ts{color:var(--ok)}
.tk.c{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tk.n{border-style:dashed;background:transparent;cursor:default}
@media (max-width:760px){ .track{grid-template-columns:repeat(4,minmax(0,1fr))} }
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){ .cols{grid-template-columns:minmax(0,1fr)} }
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.drive{display:inline-flex;gap:6px;align-items:center;font:500 12px/1.35 var(--f-mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere;max-width:100%}
.drive svg{width:13px;height:13px;flex:none}
.quote{font-size:14px;line-height:1.55;max-width:65ch}

/* stage page */
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface)}
.step.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.step.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.arr{color:var(--muted);font-size:12px}
.actbox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.actbox.idle{border-color:var(--line);background:var(--surface)}
.actbox .row{display:flex;flex-wrap:wrap;gap:8px}
.ver{border-top:1px solid var(--line-2);padding:14px 16px;display:grid;gap:8px}
.ver:first-child{border-top:0}
.vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vtag{font:600 12px/1 var(--f-mono);background:var(--ink);color:var(--surface);padding:4px 7px;border-radius:4px}
.dl{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;font-size:13px;align-items:start}
.dl i{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--line)}
.dl i.ok{background:var(--ok)} .dl i.ret,.dl i.changes{background:var(--crit)} .dl i.wait{background:var(--warn)} .dl i.rel{background:var(--accent)} .dl i.received{background:var(--ok)}
.lay{display:flex;gap:6px;flex-wrap:wrap}
.lay span{font:600 11.5px/1 var(--f-mono);padding:5px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.lay span.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.strip{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--warn-soft)}
.strip.ok{background:var(--ok-soft)} .strip.info{background:var(--accent-soft)} .strip.crit{background:var(--crit-soft)}
.cm{padding:12px 16px;border-top:1px solid var(--line-2);display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 10.5px/1 var(--f-mono);background:var(--surface-2);border:1px solid var(--line)}
.av.ext{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.itag{font:600 9.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px}
.cmf{padding:12px 16px;border-top:1px solid var(--line-2);display:grid;gap:8px}
.cmf textarea{width:100%;min-height:64px;resize:vertical}
.cmf .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.cmf label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));box-shadow:0 24px 64px var(--shadow)}
dialog::backdrop{background:var(--overlay)}
.dh{padding:18px 18px 0;display:grid;gap:4px}
.db{padding:14px 18px;display:grid;gap:12px}
.df{padding:4px 18px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fld{display:grid;gap:6px;font-size:13px;font-weight:600}
.fld input,.fld textarea{width:100%;font-weight:400}
.fld textarea{min-height:90px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:400}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:3px}

/* drawer + popovers */

  function sortProjects(list){ var co=Object.keys(E.COUNTRIES); return list.slice().sort(function(a,b){ var d=co.indexOf(a.country)-co.indexOf(b.country); return d||S.projects.indexOf(a)-S.projects.indexOf(b); }); }

      case 'itemUpload': t='Add link · '+it.name; b=fld('f-link','Drive link','input','Shared › 01 Store documents › '+it.name,true)+hint('Put the file in the shared Drive folder first, then paste its link here.'); ok='Mark uploaded'; break;
      case 'itemReturn': t='Send back · '+it.name; b=fld('f-note','Reason','textarea','',true,'e.g. The CAD file is missing the ceiling plan'); ok='Send back'; break;
      case 'issueDoc': it=g.items[item-1]; t='Issue · '+it.name; b=fld('f-link','Drive link','input','Shared › 04 Handover › '+it.name,true)+hint('Issued date is recorded as today. When all three documents are issued, Store Opens is next.'); ok='Mark issued'; break;
      case 'updateLatest': t='Latest update · '+p.store; b=fld('f-text','Update','textarea',p.latest?p.latest.text:'',true)+hint('Partners and the Apple PM see this on their home screen. No email is sent.'); ok='Post update'; break;
    }
    pending={action:action,pid:pid,n:+n,item:item?(typeof item==='string'?item:+item):null};
    dlgf.innerHTML='<div class="dh"><p class="eyebrow" style="margin:0">'+esc(p.store)+'</p><h2 id="dlg-title">'+esc(t)+'</h2></div><div class="db">'+b+'</div><div class="df"><button type="button" class="btn ghost" data-dlg="cancel">Cancel</button><button type="submit" class="btn p" id="dlg-ok">'+esc(ok)+'</button></div>';
    validate(); dlg.showModal();
    var f=dlgf.querySelector('textarea[data-req],input[data-req]:not([type=radio]),input[type=radio]'); if(f) f.focus();
  }
  function validate(){
    var okb=document.getElementById('dlg-ok'); if(!okb) return;
    var good=true;
    dlgf.querySelectorAll('[data-req]').forEach(function(el){ if(el.type==='radio'){ if(!dlgf.querySelector('input[name="'+el.name+'"]:checked')) good=false; } else if(!String(el.value).trim()) good=false; });
    okb.disabled=!good;
  }
  dlgf.addEventListener('input',validate);
  dlgf.addEventListener('change',validate);
  dlgf.addEventListener('submit',function(e){
    e.preventDefault(); if(!pending) return;
    var fd=new FormData(dlgf), q={pid:pending.pid,n:pending.n,item:pending.item,note:fd.get('f-note')||'',link:fd.get('f-link')||'',text:fd.get('f-text')||'',date:fd.get('f-date')||'',appleId:fd.get('f-appleId')||'',sfo:fd.get('f-sfo')||'',client:fd.get('f-client')||'',country:fd.get('f-country')||'',store:fd.get('f-store')||'',target:fd.get('f-target')||'',kit:fd.get('f-kit')||''};
    var a=pending.action; pending=null; dlg.close(); doAct(a,q);
  });
  dlgf.addEventListener('click',function(e){ if(e.target.closest('[data-dlg="cancel"]')){ pending=null; dlg.close(); } });

  /* ---------- events ---------- */
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-go],[data-act],[data-mode],[data-ui],[data-try],[data-tab],[data-health],[data-cal],[data-day],[data-evt],[data-sort]');
    if(!el||el.closest('dialog')) { if(U.bell&&!e.target.closest('.bellp')&&!e.target.closest('[data-ui="bell"]')){ U.bell=false; render(); } return; }
    if(el.dataset.sort){ var sk=el.dataset.sort; U.sort=U.sort.k===sk?{k:sk,dir:U.sort.dir==='asc'?'desc':'asc'}:{k:sk,dir:sk==='target'?'asc':'desc'}; render(); return; }
    if(el.dataset.go){ var a=el.dataset.go.split('|'); go(a[0],a[1],a[2]); return; }
    if(el.dataset.evt){ U.cal.type=U.cal.type===el.dataset.evt?'':el.dataset.evt; render(); return; }
    if(el.dataset.cal){ var cm=el.dataset.cal; if(cm==='prev'){ U.cal.m--; if(U.cal.m<0){ U.cal.m=11; U.cal.y--; } } else if(cm==='next'){ U.cal.m++; if(U.cal.m>11){ U.cal.m=0; U.cal.y++; } } else { U.cal.y=2026; U.cal.m=10; U.cal.sel=E.TODAY; } render(); return; }
    if(el.dataset.day){ U.cal.sel=el.dataset.day; render(); return; }
    if(el.dataset.health){ U.filt.health=U.filt.health===el.dataset.health?'':el.dataset.health; render(); return; }
    if(el.dataset.tab){ U.tab=el.dataset.tab; render(); return; }
    if(el.dataset.mode){ var m=el.dataset.mode.split('|'); U.modes[m[0]]=m[1]; render(); return; }
    if(el.dataset.act){ var ac=el.dataset.act, q={pid:el.dataset.pid||null,n:+el.dataset.n||0,item:el.dataset.party?el.dataset.party:el.dataset.item?+el.dataset.item:null}; if(DIRECT[ac]) doAct(ac,q); else openModal(ac,q.pid,q.n,q.item); return; }
    if(el.dataset.try){ var t=el.dataset.try.split('|'), st=E.scenarios[+t[0]].steps[+t[1]]; U.persona=st.persona; U.bell=false; if(window.innerWidth<1180) U.tryOpen=false; go(st.go.view,st.go.pid,st.go.n); return; }
    switch(el.dataset.ui){
      case 'bell': U.bell=!U.bell; render(); break;
      case 'try': U.tryOpen=!U.tryOpen; render(); break;
      case 'reset': U.confirmReset=true; render(); break;
      case 'resetNo': U.confirmReset=false; render(); break;
      case 'resetYes': S=E.seed(); var keep=U.modes; U=defUI(); U.modes=keep; render(); toast('Example data reset to Monday 23 Nov 2026.','ok'); break;
    }
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='persona'){ U.persona=t.value; U.view=homeOf(t.value); U.pid=null; U.n=null; U.bell=false; render(); return; }
    if(t.id==='f-country'){ U.filt.country=t.value; render(); return; }
    if(t.id==='f-reseller'){ U.filt.reseller=t.value; render(); return; }
    if(t.id==='cm-int'){ U.intComment=t.checked; save(); }
  });
  document.addEventListener('input',function(e){
    if(e.target.id==='q'){ U.filt.q=e.target.value; render(); return; }
    if(e.target.id==='cm-text'){ var b=e.target.closest('form').querySelector('button[type=submit]'); b.disabled=!e.target.value.trim(); }
  });
  document.addEventListener('submit',function(e){
    var f=e.target; if(f.dataset.form!=='comment') return;
    e.preventDefault();
    var txt=f.querySelector('#cm-text').value, chk=f.querySelector('#cm-int');
    doAct('comment',{pid:f.dataset.pid,n:+f.dataset.n,text:txt,internal:chk?chk.checked:false});
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&(U.bell)){ U.bell=false; render(); } if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.dataset&&e.target.dataset.day){ e.preventDefault(); U.cal.sel=e.target.dataset.day; render(); } });

  load(); render();
})();
</script>
