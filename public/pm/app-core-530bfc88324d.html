<!doctype html>
<html lang="en">
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<title>APP CORE Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky top bar, persona strip, left nav + main; Try-this drawer on the right. Same tokens as the Process & UX/UI spec. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#151A20; --muted:#59636E; --line:#D5DBE1; --line-2:#E7EBEF;
  --accent:#2350C4; --accent-ink:#FFFFFF; --accent-soft:#E6ECFA; --on-strong:#FFFFFF;
  --ok:#1B7745; --ok-soft:#E2F2E9; --warn:#8F5D06; --warn-soft:#FAEFD8; --crit:#B2352A; --crit-soft:#FAE5E2;
  --apple:#3A3F47; --apple-soft:#E6E8EC; --shadow:rgba(20,26,32,.14); --overlay:rgba(13,16,20,.45);
  --nav:#1B1F3B; --nav-2:#2B3166; --nav-ink:#C9CEE6; --nav-line:rgba(255,255,255,.18);
  --s-na:#7D8795; --s-todo:#B8C0CB; --s-prog:#2F76D6; --s-rev:#8B4FC9; --s-cli:#C96F08; --s-app:#5B6B82; --s-chg:#CF3149; --s-fee:#D13A72; --s-ok:#0E8F55;
  --h-on:#0E8F55; --h-risk:#C96F08; --h-late:#CF3149; --h-done:#0A6B40;
  --g1:#6B5BD2; --g2:#2F76D6; --g3:#0C7FB0; --g4:#0B7F75; --g5:#0E8F55; --g6:#55820A; --g7:#A9650A; --g8:#C23A72;
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1014; --surface:#151A20; --surface-2:#11151A; --ink:#E5E8EC; --muted:#9BA5B0; --line:#2E3540; --line-2:#222830;
  --accent:#86A4FF; --accent-ink:#0D1014; --accent-soft:#1B2643; --on-strong:#0D1014;
  --ok:#5BC68E; --ok-soft:#14281D; --warn:#E3B25A; --warn-soft:#2D2413; --crit:#F27D71; --crit-soft:#331A19;
  --apple:#CDD2D9; --apple-soft:#262B33; --shadow:rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6); --nav:#0F1226; --nav-2:#232A55; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1014; --surface:#151A20; --surface-2:#11151A; --ink:#E5E8EC; --muted:#9BA5B0; --line:#2E3540; --line-2:#222830;
  --accent:#86A4FF; --accent-ink:#0D1014; --accent-soft:#1B2643; --on-strong:#0D1014;
  --ok:#5BC68E; --ok-soft:#14281D; --warn:#E3B25A; --warn-soft:#2D2413; --crit:#F27D71; --crit-soft:#331A19;
  --apple:#CDD2D9; --apple-soft:#262B33; --shadow:rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6); --nav:#0F1226; --nav-2:#232A55; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.005em}
h1{font-size:24px;font-weight:700;line-height:1.2}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.small{font-size:12.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{display:grid;grid-template-columns:repeat(4,5px);gap:2px;align-items:end;height:18px}
.mark i{display:block;background:var(--accent);border-radius:1px}
.mark i:nth-child(1){height:6px}.mark i:nth-child(2){height:10px}.mark i:nth-child(3){height:14px}.mark i:nth-child(4){height:18px;background:var(--line)}
.bn{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap}
.tag{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:100%}
#persona{font-weight:600;color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.crit{background:var(--crit);border-color:var(--crit);color:var(--on-strong)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{position:relative;width:36px;height:34px;padding:0}
.ib svg{width:18px;height:18px}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:var(--on-strong);font:600 11px/18px var(--f-mono);text-align:center;padding:0 4px}
.rs{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600}
.pstrip{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.pstrip .in{max-width:1440px;margin:0 auto;padding-block:8px;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.pstrip b{font-weight:600}
.pstrip .pb{color:var(--muted)}
.side{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;align-self:center}
.side.int{background:var(--surface);color:var(--accent)}
.side.ext{background:var(--ink);color:var(--surface)}

/* shell */
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:176px minmax(0,1fr);gap:24px;padding-block:20px 72px}
.nav{display:flex;flex-direction:column;gap:2px;align-self:start}
.nh{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.nb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border:0;background:transparent;text-align:left;cursor:pointer;font-weight:600;color:var(--muted)}
.nb:hover{color:var(--ink)}
.nb[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.cnt{font:600 11px/1 var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:3px 6px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1180px){ body.try-open .gut.wide{padding-right:396px} }
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:12px 72px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nh{display:none}
  .nb{white-space:nowrap}
  .who > span{display:none}
  #persona{max-width:calc(100vw - 32px)}
}

/* screen header */
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.sh > div{min-width:0}
.eyebrow{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sub{color:var(--muted);margin-top:6px;max-width:68ch}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600}
.crumbrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.backb{gap:6px}
.backb span{font-size:16px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button svg{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.bar{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.bar label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pbd{padding:14px 16px;display:grid;gap:10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.hint-row{font-size:12.5px;color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);line-height:1.4}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.plain::before{display:none}
.st-in_progress,.st-internal_review,.chip.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st-with_client,.st-awaiting_fee,.h-at_risk,.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st-with_apple,.chip.apple{background:var(--apple-soft);color:var(--apple);border-color:transparent}
.st-changes_requested,.h-delayed,.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.st-signed_off,.h-on_track,.h-completed,.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font:600 10px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.t td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.grp td{background:var(--surface-2);font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px}
.t .tight{white-space:nowrap}
.lnk{border:0;background:none;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-align:left}
.lnk:hover{color:var(--accent);text-decoration:underline}
.sb{display:inline-grid;grid-template-columns:repeat(6,10px);gap:2px;vertical-align:middle;margin-right:6px}
.sb i{height:6px;border-radius:2px;background:var(--line)}
.sb i.d{background:var(--ok)} .sb i.c{background:var(--accent)} .sb i.n{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.upd{max-width:42ch;color:var(--muted);font-size:12.5px}

/* pipeline + kanban */
table.pipe{min-width:1100px;table-layout:fixed}
.pipe th.sc,.pipe td.sc{width:210px}
.pipe th{padding:8px 2px;background:var(--surface-2);text-transform:none;letter-spacing:0;white-space:normal}
.pipe th.sc{padding:8px 12px;text-align:left;vertical-align:bottom;font:600 10px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.07em}
.chev{display:block;padding:9px 16px 9px 12px;color:#fff;font:600 12px/1.2 var(--f-display);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe td{padding:6px 3px}
.pc{display:flex;flex-direction:column;gap:3px;border-radius:8px;padding:8px 10px;min-height:58px;font-size:12px;border:1px solid transparent;width:100%;text-align:left;background:none;cursor:pointer;line-height:1.3;color:inherit}
.pc b{font-weight:600}
.pc.done{background:var(--s-ok);color:#fff}
.pc.cur{color:#fff}
.pc.todo{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line);cursor:default}
.pc.na{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line-2) 6px 12px);color:var(--muted);cursor:default;justify-content:center}
.pc .tchip{display:block;background:#fff;color:#1B1F3B;border-radius:4px;padding:3px 6px;font-weight:600;font-size:11.5px;margin-top:2px}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(212px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{display:flex;flex-direction:column;min-width:0;gap:8px}
.kcol > header{display:flex;gap:8px;align-items:center;padding:10px 14px;color:#fff;font:600 14px/1.2 var(--f-display);border-radius:8px}
.kn{font:600 11px/1 var(--f-mono);opacity:.85}
.kc{margin-left:auto;font:600 12px/1 var(--f-mono);background:rgba(255,255,255,.25);border-radius:9px;padding:3px 8px}
.kcards{padding:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:8px;min-height:180px;flex:1}
.kcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bar,var(--line));border-radius:8px;padding:10px 12px;cursor:pointer;width:100%;box-shadow:0 1px 2px var(--shadow)}
.kcard:hover{border-color:var(--accent);border-left-color:var(--bar,var(--accent))}
.kcard b{font-weight:600;line-height:1.3}
.kcard .small{line-height:1.35}
.kempty{color:var(--muted);font-size:12px;padding:12px 4px;text-align:center}

/* project page */
.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tk{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.tk .tn{font:600 10.5px/1 var(--f-mono);color:var(--muted)}
.tk .tl{font-weight:600;font-size:12.5px;line-height:1.25;overflow-wrap:anywhere}
.tk .ts{font-size:11.5px;color:var(--muted);line-height:1.3}
.tk.d{background:var(--ok-soft);border-color:transparent}
.tk.d .ts{color:var(--ok)}
.tk.c{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tk.n{border-style:dashed;background:transparent;cursor:default}
@media (max-width:760px){ .track{grid-template-columns:repeat(4,minmax(0,1fr))} }
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){ .cols{grid-template-columns:minmax(0,1fr)} }
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.docs{display:grid}
.nbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sdet{padding:12px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);display:grid;gap:8px;font-size:13px}
.sdet .kv,.rv-note .kv{margin:0}
.lnks{display:grid;gap:6px}
.lrow{display:flex;gap:6px;align-items:center}
.lrow input{flex:1;min-width:0;font-weight:400}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.rlink{display:grid;gap:6px;padding:10px 12px;border:1px dashed var(--accent);border-radius:8px;background:var(--accent-soft);margin-bottom:10px}
.rrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rrow input{flex:1 1 240px;min-width:0;font:12px/1.3 var(--f-mono)}
.arep{padding:10px 12px;border-radius:8px;border-left:4px solid var(--line);background:var(--surface-2);margin-bottom:10px}
.arep.ok{border-left-color:var(--ok);background:var(--ok-soft)} .arep.chg{border-left-color:var(--crit);background:var(--crit-soft)}
.arep p{margin:6px 0 0}
.acard{border:1px solid var(--line);border-left:5px solid var(--sc);border-radius:10px;padding:12px 14px;display:grid;gap:10px;margin-bottom:12px;background:var(--surface)}
.acard:last-child{margin-bottom:0}
.ach{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cnt2{font:600 11px/1 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 7px;vertical-align:2px;margin-left:4px}
.rv-main{max-width:820px;margin:28px auto 64px}
.rv-card .pbd{display:grid;gap:14px;padding:22px}
.rv-card h1{margin:0}
.rv-note{padding:12px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2)} .rv-note p{margin:4px 0 0}
.rv-files{display:grid;gap:8px}
.pvtabs{margin-bottom:2px}
.rv-prev{width:100%;height:560px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.rv-hist ul{margin:6px 0 0;padding-left:18px} .rv-hist{font-size:13px;color:var(--muted)}
.rv-form{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.rv-state{padding:14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)} .rv-state.ok{background:var(--ok-soft);border-color:transparent} .rv-state.chg{background:var(--crit-soft);border-color:transparent} .rv-state p{margin:6px 0 0}
.kds{display:grid;gap:0;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.kd{display:grid;grid-template-columns:120px 100px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line-2)}
.kds .kd:nth-child(2){border-top:0}
.kd .kdl{color:var(--muted);font-size:13px}
.kd b{font-variant-numeric:tabular-nums}
.kd .kdc{font:600 11.5px/1 var(--f-body);padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.kd.ds-ok b{color:var(--ok)} .kd.ds-ok .kdc{background:var(--ok-soft);color:var(--ok)}
.kd.ds-risk b{color:var(--warn)} .kd.ds-risk .kdc{background:var(--warn-soft);color:var(--warn)}
.kd.ds-late b{color:var(--crit)} .kd.ds-late .kdc{background:var(--crit-soft);color:var(--crit)}
.kd.ds-done .kdc{background:var(--ok-soft);color:var(--ok)}
.docl{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line-2);min-width:0;white-space:nowrap}
.docs .docl:first-child{border-top:0}
.docl .dn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.docl .chip,.docl .btn,.docl .drive{flex:none}
.docl .dl-path{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.chk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;margin:0}
.sheet td.ed{cursor:pointer}
.sheet .edc{display:inline-flex;align-items:center;gap:6px}
.sheet .edi{display:inline-flex;color:var(--cal-hover)}
.sheet .edi svg{width:13px;height:13px}
.sheet td.ed:hover .edi{transform:scale(1.15)}
td.due{white-space:nowrap}
.doc{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line-2);justify-items:start}
.doc:first-child{border-top:0;padding-top:4px}
.doc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.dsub{font:600 10.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
a.drive.lk{color:var(--accent);text-decoration:none;max-width:100%}
a.drive.lk:hover{text-decoration:underline}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.drive{display:inline-flex;gap:6px;align-items:center;font:500 12px/1.35 var(--f-mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere;max-width:100%}
.drive svg{width:13px;height:13px;flex:none}
.quote{font-size:14px;line-height:1.55;max-width:65ch}

/* stage page */
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface)}
.step.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.step.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.arr{color:var(--muted);font-size:12px}
.actbox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.actbox.idle{border-color:var(--line);background:var(--surface)}
.actbox .row{display:flex;flex-wrap:wrap;gap:8px}
.ver{border-top:1px solid var(--line-2);padding:14px 16px;display:grid;gap:8px}
.ver:first-child{border-top:0}
.vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vtag{font:600 12px/1 var(--f-mono);background:var(--ink);color:var(--surface);padding:4px 7px;border-radius:4px}
.dl{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;font-size:13px;align-items:start}
.dl i{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--line)}
.dl i.ok{background:var(--ok)} .dl i.ret,.dl i.changes{background:var(--crit)} .dl i.wait{background:var(--warn)} .dl i.rel{background:var(--accent)} .dl i.received{background:var(--ok)}
.lay{display:flex;gap:6px;flex-wrap:wrap}
.lay span{font:600 11.5px/1 var(--f-mono);padding:5px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.lay span.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.strip{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--warn-soft)}
.strip.ok{background:var(--ok-soft)} .strip.info{background:var(--accent-soft)} .strip.crit{background:var(--crit-soft)}
.cm{padding:12px 16px;border-top:1px solid var(--line-2);display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 10.5px/1 var(--f-mono);background:var(--surface-2);border:1px solid var(--line)}
.av.ext{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.itag{font:600 9.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px}
.cmf{padding:12px 16px;border-top:1px solid var(--line-2);display:grid;gap:8px}
.cmf textarea{width:100%;min-height:64px;resize:vertical}
.cmf .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.cmf label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));box-shadow:0 24px 64px var(--shadow)}
dialog::backdrop{background:var(--overlay)}
dialog.cfm{width:min(400px,calc(100vw - 32px))}
.dh{padding:18px 18px 0;display:grid;gap:4px}
.db{padding:14px 18px;display:grid;gap:12px}
.df{padding:4px 18px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fld{display:grid;gap:6px;font-size:13px;font-weight:600}
.fld input,.fld textarea{width:100%;font-weight:400}
.fld textarea{min-height:90px;resize:vertical}
.rt{border:0;padding:0;margin:0;display:grid;gap:8px;text-align:left}
.rt legend{font-size:13px;font-weight:600;padding:0;margin-bottom:6px}
.rt-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left}
.rt-opt input{width:auto;flex:none;margin:2px 0 0;accent-color:var(--accent)}
.rt-opt span{display:grid;gap:2px;font-size:13.5px}
.rt-opt small{font-size:12.5px;color:var(--muted);font-weight:400}
.rt-opt:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:400}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:3px}

/* drawer + popovers */
.try{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-12px 0 40px var(--shadow)}
.try-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.try-b{overflow-y:auto;padding:14px 18px 28px;display:grid;gap:18px;align-content:start}
.scn{display:grid;gap:6px}
.scn .meta{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stp{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:start;font-size:13px;padding:5px 0;border-top:1px solid var(--line-2)}
.ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;margin-top:1px}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.on::after{content:"";width:8px;height:4px;border-left:2px solid var(--on-strong);border-bottom:2px solid var(--on-strong);transform:rotate(-45deg) translate(1px,-1px)}
.stp.done span{color:var(--muted)}
.bellp{position:fixed;z-index:35;top:calc(env(safe-area-inset-top,0px) + 96px);right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 40px var(--shadow)}
.ni{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;padding:10px 14px;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;width:100%;cursor:pointer;font-size:13px}
.ni:hover{background:var(--surface-2)}
.ni i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.ni.new i{background:var(--accent)}
#toasts{position:fixed;z-index:60;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--surface);border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:0 8px 24px var(--shadow);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;animation:tin .18s ease-out}
.toast .tk2{font:600 10px/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.toast.err{background:var(--crit);color:var(--on-strong)}
@keyframes tin{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ .toast{animation:none} }
/* ===== visual refresh: colour-coded status, stage palette, navy chrome ===== */
.top{background:var(--nav);border-bottom:0;color:#fff}
.bn{color:#fff}
.who{color:var(--nav-ink)}
.mark i{background:#5DA8FF}
.mark i:nth-child(2){background:#3DDC97}
.mark i:nth-child(3){background:#FFC857}
.mark i:nth-child(4){background:#FF7AA8}
.top .btn{background:var(--nav-2);border-color:var(--nav-line);color:#fff}
.top .btn:hover{border-color:#fff}
.top .btn.ghost{background:transparent}
.top .btn.crit{background:var(--s-chg);border-color:var(--s-chg)}
.top .rs{color:#fff}
.top .tag{background:#FFC857;color:#1B1F3B}
#persona{background:#fff;color:#151A20;border-color:#fff}
.pstrip{background:var(--surface)}
.pstrip .in{align-items:center}
.pav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px/1 var(--f-mono);flex:none}
.side.int{background:var(--accent-soft)}

.logo{height:30px;width:auto;display:block;flex:none}
.bsep{width:1px;height:26px;background:var(--nav-line);flex:none}
.brand{flex-wrap:wrap;row-gap:6px}
.bn{font-size:14px;line-height:1.2;white-space:normal}
@media (max-width:560px){ .bn{font-size:12px} .logo{height:26px} .top{position:static} }
/* navigation */
.shell{grid-template-columns:212px minmax(0,1fr)}
.nav{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);gap:2px}
.nb{gap:10px;padding:10px;border-radius:8px}
.nb svg{width:18px;height:18px;flex:none}
.nb .lb{flex:1;min-width:0}
.nb:hover{background:var(--surface-2);color:var(--ink)}
.nb[aria-current="page"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.nb[aria-current="page"] .cnt{background:var(--accent-ink);color:var(--accent)}
.cnt{background:var(--s-fee);color:#fff}
.lg{display:grid;gap:7px;padding:4px 10px}
.lgi{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.lgi i{width:10px;height:10px;border-radius:3px;flex:none}

/* solid status colours */
.fl{display:flex;align-items:center;justify-content:center;min-height:48px;padding:6px 10px;font-weight:600;font-size:12.5px;line-height:1.25;text-align:center;color:#fff}
.st-not_started{background:var(--s-todo);color:#1B1F3B;border-color:transparent}
.st-in_progress{background:var(--s-prog);color:#fff;border-color:transparent}
.st-internal_review{background:var(--s-rev);color:#fff;border-color:transparent}
.st-with_client{background:var(--s-cli);color:#fff;border-color:transparent}
.st-with_apple{background:var(--s-app);color:#fff;border-color:transparent}
.st-changes_requested{background:var(--s-chg);color:#fff;border-color:transparent}
.st-awaiting_fee{background:var(--s-fee);color:#fff;border-color:transparent}
.st-signed_off{background:var(--s-ok);color:#fff;border-color:transparent}
.st-na{background:var(--s-na);color:#fff;border-color:transparent}
.h-on_track{background:var(--h-on);color:#fff;border-color:transparent}
.h-at_risk{background:var(--h-risk);color:#fff;border-color:transparent}
.h-delayed{background:var(--h-late);color:#fff;border-color:transparent}
.h-completed{background:var(--h-done);color:#fff;border-color:transparent}
.w-WSPN{background:var(--g1);color:#fff;border-color:transparent}
.w-Client{background:var(--s-cli);color:#fff;border-color:transparent}
.w-Apple{background:var(--s-app);color:#fff;border-color:transparent}
.w-You{background:var(--s-fee);color:#fff;border-color:transparent}
.w-done{background:var(--h-done);color:#fff;border-color:transparent}
.stg1{background:var(--g1);color:#fff}.stg2{background:var(--g2);color:#fff}.stg3{background:var(--g3);color:#fff}.stg4{background:var(--g4);color:#fff}
.stg5{background:var(--g5);color:#fff}.stg6{background:var(--g6);color:#fff}.stg7{background:var(--g7);color:#fff}.stg8{background:var(--g8);color:#fff}
.chip[class*=" st-"]::before,.chip[class*=" h-"]::before,.chip[class*=" w-"]::before{display:none}
.t td.fill{padding:0;border-left:2px solid var(--surface);border-right:2px solid var(--surface);min-width:112px}
.t td.hbar{box-shadow:inset 5px 0 0 var(--hc,var(--line));padding-left:16px}
.sb{grid-template-columns:repeat(6,12px)}
.sb i{height:8px}
.sb i.c{background-image:linear-gradient(90deg,transparent 50%,rgba(255,255,255,.65) 50%)}

/* view tabs, search, summary tiles */
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.vtabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.vtabs button svg{width:15px;height:15px}
.vtabs button:hover{color:var(--ink)}
.vtabs button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.tb{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-width:220px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;padding:8px 0;background:transparent;min-width:0;width:100%}
.search input:focus-visible{outline:none}
.search:focus-within{outline:2px solid var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:0;border-radius:10px;padding:12px 14px;color:#fff;text-align:left;display:grid;gap:2px;font:inherit;font-weight:600}
button.tile{cursor:pointer}
.tile b{font:700 28px/1 var(--f-display)}
.tile span{font-size:12.5px}
.tile[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.t-all{background:var(--nav-2)}.t-late{background:var(--h-late)}.t-risk{background:var(--h-risk)}.t-on{background:var(--h-on)}.t-done{background:var(--h-done)}.t-you{background:var(--s-fee)}.t-wspn{background:var(--g1)}
.panel.hot{border-left:5px solid var(--s-fee)}

/* banners */
.band{border-radius:12px;padding:18px 20px;color:#fff;background:linear-gradient(115deg,var(--nav) 30%,var(--sc,var(--nav-2)));display:grid;gap:12px}
.band h1{color:#fff}
.band .eyebrow{color:rgba(255,255,255,.78);margin-bottom:6px}
.band .sub{color:rgba(255,255,255,.88)}
.band .chip{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.band .chip.plain{background:rgba(255,255,255,.16);color:#fff;border-color:transparent;box-shadow:none}
.mseg{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;height:8px}
.mseg i{border-radius:2px;background:rgba(255,255,255,.2)}

/* stage track */
.tk{border-top:5px solid var(--sc,var(--line))}
.tk.d{background:var(--ok-soft);border-color:var(--line-2);border-top-color:var(--s-ok)}
.tk.c{background:var(--sc);border-color:var(--sc);color:#fff;box-shadow:none}
.tk.c .tn,.tk.c .ts{color:rgba(255,255,255,.92)}
.tk.n{opacity:.85}
.actbox{border-left:5px solid var(--accent)}
.actbox.idle{border-left-color:var(--line)}

/* try drawer */
.try-h{background:var(--nav);color:#fff}
.try-h .eyebrow{color:var(--nav-ink)}
.try-h .btn{background:transparent;color:#fff;border-color:var(--nav-line)}

@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;position:static;padding:6px}
  .lg,.nh{display:none}
  .search{min-width:0;flex:1 1 100%}
}

/* ===== A2: APP CORE TRACKER format ===== */

:root[data-theme="dark"]{ --sh-blue:#1D4655; --sh-green:#2E7D19; --sh-orange:#8A5A00; --sh-grey:#2B323B; --sh-send:#2F7A19; --sh-sendink:#FFFFFF; --sh-ink:#E5E8EC; --sh-line:#3A424D; --sh-chg:#4A2320; }

.chip[class*=" st-"]::before,.chip[class*=" h-"]::before,.chip[class*=" w-"]::before{display:none}

/* tracker sheet (same columns and colours as the PDF tracker) */
.v2{--v2-bg:#F4F5F8;--v2-card:#FFFFFF;--v2-line:#E3E6ED;--v2-row:#ECEEF2;--v2-ink:#1A1D29;--v2-ink2:#4A5064;--v2-mute:#5B6275;--v2-pri:#2F5BEA;--v2-head:#F8F9FB;--v2-hover:#F7F8FC;--v2-xp:#F8F9FC;--v2-off:#E6E8EE;--v2-chip:#F1F2F5;

  --hb-on_track:#E6F6EC;--hf-on_track:#0F6B3A;--hb-at_risk:#FDF1E3;--hf-at_risk:#8A4B08;--hb-delayed:#FDE8EA;--hf-delayed:#A11D2E;--hb-on_hold:#EEF0F3;--hf-on_hold:#4B5563;--hb-completed:#E3F2EA;--hf-completed:#0B5132;
  --d-ok:#0F7A3D;--d-risk:#A85206;--d-late:#B42318;
  font-family:'IBM Plex Sans','IBM Plex Sans Thai',system-ui,sans-serif;color:var(--v2-ink);display:flex;flex-direction:column;gap:16px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .v2{--v2-card:var(--surface);--v2-line:var(--line);--v2-row:var(--line-2);--v2-ink:var(--ink);--v2-ink2:var(--muted);--v2-mute:var(--muted);--v2-head:var(--surface-2);--v2-hover:var(--surface-2);--v2-xp:var(--surface-2);--v2-off:var(--line);--v2-chip:var(--surface-2);--h-all:var(--ink);--hb-on_track:var(--ok-soft);--hf-on_track:var(--ok);--hb-at_risk:var(--warn-soft);--hf-at_risk:var(--warn);--hb-delayed:var(--crit-soft);--hf-delayed:var(--crit);--hb-on_hold:var(--surface-2);--hf-on_hold:var(--muted);--hb-completed:var(--ok-soft);--hf-completed:var(--ok);--d-ok:var(--ok);--d-risk:var(--warn);--d-late:var(--crit)} }
:root[data-theme="dark"] .v2{--v2-card:var(--surface);--v2-line:var(--line);--v2-row:var(--line-2);--v2-ink:var(--ink);--v2-ink2:var(--muted);--v2-mute:var(--muted);--v2-head:var(--surface-2);--v2-hover:var(--surface-2);--v2-xp:var(--surface-2);--v2-off:var(--line);--v2-chip:var(--surface-2);--h-all:var(--ink);--d-ok:var(--ok);--d-risk:var(--warn);--d-late:var(--crit)}
.v2 :focus-visible{outline:2px solid var(--v2-pri);outline-offset:2px}
.v2 .btn{border-radius:8px;min-height:38px;display:inline-flex;align-items:center;gap:8px;font-family:inherit}

    if(el.dataset.cal){ var cm=el.dataset.cal; if(cm==='prev'){ U.cal.m--; if(U.cal.m<0){ U.cal.m=11; U.cal.y--; } } else if(cm==='next'){ U.cal.m++; if(U.cal.m>11){ U.cal.m=0; U.cal.y++; } } else { U.cal.y=+E.TODAY.slice(0,4); U.cal.m=+E.TODAY.slice(5,7)-1; U.cal.sel=E.TODAY; } render(); return; }
    if(el.dataset.day){ U.cal.sel=el.dataset.day; if(U.cal.mode!=='week'){ U.cal.y=+U.cal.sel.slice(0,4); U.cal.m=+U.cal.sel.slice(5,7)-1; } render(); return; }
    if(el.dataset.health){ U.filt.health=U.filt.health===el.dataset.health?'':el.dataset.health; render(); return; }
    if(el.dataset.tab){ U.tab=el.dataset.tab; render(); return; }
    if(el.dataset.mode){ var m=el.dataset.mode.split('|'); U.modes[m[0]]=m[1]; render(); return; }
    if(el.dataset.del){ var xp=E.P(S,el.dataset.del); if(!xp) return; var xid=xp.id;
      confirmThen('Delete '+xp.store+'?','Apple ID '+(xp.appleId||'—')+' · SFO '+(xp.sfo||'—')+' · '+cname(xp)+'. This removes the store and all its dates, documents and notes for everyone. It can’t be undone.',function(){ if(doAct('deleteJob',{pid:xid,n:1})){ U.pid=null; U.n=null; U.t2open=null; go('tracker2'); } },{yes:'Yes, delete',crit:true});
      return; }
    if(el.dataset.act){ var ac=el.dataset.act, q={pid:el.dataset.pid||null,n:+el.dataset.n||0,item:el.dataset.party?el.dataset.party:el.dataset.item?+el.dataset.item:null}; if(DIRECT[ac]){ var dp=q.pid?E.P(S,q.pid):null; confirmThen((el.textContent||'Confirm').trim()+'?',dp?dp.store:'',function(){ doAct(ac,q); }); } else openModal(ac,q.pid,q.n,q.item); return; }
    if(el.dataset.try){ var t=el.dataset.try.split('|'), st=E.scenarios[+t[0]].steps[+t[1]]; U.bell=false; if(window.innerWidth<1180) U.tryOpen=false; go(st.go.view,st.go.pid,st.go.n); return; }
    switch(el.dataset.ui){
      case 'bell': U.bell=!U.bell; render(); break;
      case 'try': U.tryOpen=!U.tryOpen; render(); break;
      case 'reset': U.confirmReset=true; render(); break;
      case 'resetNo': U.confirmReset=false; render(); break;
      case 'resetYes': S=E.seed(); var keep=U.modes; U=defUI(); U.modes=keep; render(); toast('Example data reset to Monday 23 Nov 2026.','ok'); break;
    }
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='persona'){ U.persona=t.value; U.view=homeOf(t.value); U.pid=null; U.n=null; U.bell=false; render(); return; }
    if(t.id==='f-country'){ U.filt.country=t.value; render(); return; }
    if(t.id==='f-reseller'){ U.filt.reseller=t.value; render(); return; }
    if(t.id==='cm-int'){ U.intComment=t.checked; save(); }
  });
  document.addEventListener('input',function(e){
    if(e.target.id==='q'){ U.filt.q=e.target.value; render(); return; }
    if(e.target.id==='cm-text'){ var b=e.target.closest('form').querySelector('button[type=submit]'); b.disabled=!e.target.value.trim(); }
  });
  document.addEventListener('submit',function(e){
    var f=e.target; if(f.dataset.form!=='comment') return;
    e.preventDefault();
    var txt=f.querySelector('#cm-text').value, chk=f.querySelector('#cm-int');
    doAct('comment',{pid:f.dataset.pid,n:+f.dataset.n,text:txt,internal:chk?chk.checked:false});
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&(U.bell)){ U.bell=false; render(); } if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.dataset&&e.target.dataset.day){ e.preventDefault(); U.cal.sel=e.target.dataset.day; render(); } });

  /* ================= Shared data (Supabase) =================
     Served by Program tracking (/api/pm-config answers): data lives in Supabase and is shared by everyone
     with the APP CORE Tracker permission; the Apple / Partner review page reads and replies through the
     pm_review_* database functions. Opened anywhere else (e.g. a local file server) the page keeps the
     browser-only mode. */
  var CLOUD=null, REV={}, SNAP={}, LINKS={}, READ={}, RV=null, UIKEY=KEY+'-ui', syncing=Promise.resolve();
  function readLoad(){ try{ READ=JSON.parse(localStorage.getItem(UIKEY+'-read')||'{}')||{}; }catch(e){ READ={}; } }
  function readSave(){ try{ localStorage.setItem(UIKEY+'-read',JSON.stringify(READ)); }catch(e){} }
  function cloudUILoad(){ try{ U=Object.assign(defUI(),JSON.parse(localStorage.getItem(UIKEY)||'null')||{}); }catch(e){ U=defUI(); } U.persona='admin'; U.bell=false; U.confirmReset=false; U.tryOpen=false; }
  function noteFromRow(r){ var n=Object.assign({},r.data||{}); n.id=r.id; n.to=n.to||['coord']; n.read=READ[r.id]?['admin']:[]; return n; }
  function cloudLoad(){
    var sb=CLOUD.sb;
    return Promise.all([
      sb.from('pm_projects').select('id,data,rev').order('created_at',{ascending:true}),
      sb.from('pm_notifications').select('id,data,created_at').order('id',{ascending:false}).limit(200),
      sb.from('pm_review_links').select('token')
    ]).then(function(res){
      var err=res[0].error||res[1].error||res[2].error; if(err) throw err;
      var st=E.seed(); st.seq=1e9; REV={}; SNAP={}; LINKS={};
      st.projects=res[0].data.map(function(r){ var p=r.data; p.id=r.id; REV[r.id]=r.rev; SNAP[r.id]=JSON.stringify(p); return p; });
      st.notes=res[1].data.map(noteFromRow);
      res[2].data.forEach(function(x){ LINKS[x.token]=1; });
      S=st;
    });
  }
  function cloudSync(){
    syncing=syncing.then(function(){
      var sb=CLOUD.sb, jobs=[];
      S.projects.forEach(function(p){
        var js=JSON.stringify(p); if(SNAP[p.id]===js) return;
        if(REV[p.id]==null) jobs.push(sb.from('pm_projects').insert({id:p.id,data:p}).select('rev').single().then(function(r){ if(r.error) throw r.error; REV[p.id]=r.data.rev; SNAP[p.id]=js; }));
        else { var rv=REV[p.id]; jobs.push(sb.from('pm_projects').update({data:p,rev:rv+1}).eq('id',p.id).eq('rev',rv).select('rev').then(function(r){ if(r.error) throw r.error; if(!r.data||!r.data.length){ var c=new Error('conflict'); c.conflict=true; throw c; } REV[p.id]=r.data[0].rev; SNAP[p.id]=js; })); }
      });
      Object.keys(REV).forEach(function(id){ if(S.projects.some(function(p){ return p.id===id; })) return;
        jobs.push(sb.from('pm_projects').delete().eq('id',id).then(function(r){ if(r.error) throw r.error; delete REV[id]; delete SNAP[id]; })); });
      return Promise.all(jobs).then(function(){
        var links=[], j2=[];
        S.projects.forEach(function(p){ p.stages.forEach(function(g){ if(g.n>3) return; g.versions.forEach(function(v){ [['apple',v.token],['partner',v.ptoken]].forEach(function(x){ if(x[1]&&!LINKS[x[1]]){ LINKS[x[1]]=1; links.push({token:x[1],project_id:p.id,stage:g.n,version:v.v,party:x[0]}); } }); }); }); });
        if(links.length) j2.push(sb.from('pm_review_links').insert(links).then(function(r){ if(r.error) throw r.error; }));
        S.notes.filter(function(x){ return x.id>=1e9; }).forEach(function(x){ var d=Object.assign({},x); delete d.id; d.read=[]; x.id=-x.id;
          j2.push(sb.from('pm_notifications').insert({project_id:(x.pid&&REV[x.pid]!=null)?x.pid:null,data:d}).select('id').single().then(function(r){ if(r.error) throw r.error; x.id=r.data.id; })); });
        return Promise.all(j2);
      });
    }).catch(function(err){
      toast(err&&err.conflict?'Someone else changed this store at the same time. The latest version is loaded: please check it and try again.':'Could not save to the server'+(err&&err.message?' ('+err.message+')':'')+'. The latest saved data is loaded.','err');
      return cloudLoad().then(function(){ render(); }).catch(showCrash);
    });
    return syncing;
  }
  function liveRender(){ quiet=true; try{ render(); } finally{ quiet=false; } }
  function cloudLive(){
    CLOUD.sb.channel('pm-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'pm_projects'},function(pl){
        if(pl.eventType==='DELETE'){ var id=pl.old&&pl.old.id; if(!id) return; S.projects=S.projects.filter(function(p){ return p.id!==id; }); delete REV[id]; delete SNAP[id]; liveRender(); return; }
        var r=pl.new; if(!r||!r.id||REV[r.id]===r.rev) return;
        var p=r.data; p.id=r.id; REV[r.id]=r.rev; SNAP[r.id]=JSON.stringify(p);
        var i=-1; S.projects.forEach(function(x,k){ if(x.id===r.id) i=k; }); if(i>=0) S.projects[i]=p; else S.projects.push(p);
        liveRender();
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'pm_notifications'},function(pl){
        var r=pl.new; if(!r||S.notes.some(function(x){ return x.id===r.id; })) return;
        S.notes.unshift(noteFromRow(r)); liveRender();
      })
      .subscribe();
  }
  /* Review page: build a one-store state from what pm_review_get returns, so the same reviewPage() renders it. */
  function reviewLoad(tok){
    return CLOUD.sb.rpc('pm_review_get',{p_token:tok}).then(function(res){
      if(res.error) throw res.error;
      var d=res.data, st=E.seed(); st.projects=[]; RV={token:tok};
      if(d){
        var stages=[1,2,3,4,5,6].map(function(n){ return {n:n,status:'not_started',versions:[],comments:[],items:null}; });
        stages[d.stage-1].status=d.status;
        stages[d.stage-1].versions=(d.versions||[]).map(function(x){ var v={v:x.v,sentAt:x.sentAt,link:x.link,links:x.links,note:x.note,pnote:x.pnote,psentAt:x.psentAt,reviews:x.reviews||{}}; if(x.v===d.version){ if(d.party==='apple') v.token=tok; else v.ptoken=tok; } return v; });
        st.projects=[Object.assign({id:d.project_id,docs:[],extra:[],stages:stages},d.store||{})];
      }
      S=st; U=defUI(); U.tryOpen=false;
    });
  }
  function noAccess(email){
    return '<main class="rv-main gut"><section class="panel rv-card"><div class="pbd"><h1>No access to APP CORE Tracker</h1><p>Your account'+(email?' ('+esc(email)+')':'')+' doesn’t have the APP CORE Tracker permission yet. Ask an Admin to tick it on the Users page.</p><div class="nbtns"><a class="btn" href="/">Back to Program tracking</a></div></div></section></main>';
  }
  function boot(){
    S=E.seed(); U=defUI();
    app.innerHTML='<main class="rv-main gut"><p class="small">Loading…</p></main>';
    var tok=reviewToken();
    fetch('/api/pm-config',{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }).then(function(cfg){
      if(!cfg||!cfg.url||!cfg.anonKey||!window.supabase){ CLOUD=null; load(); render(); return; }
      CLOUD={sb:window.supabase.createClient(cfg.url,cfg.anonKey)};
      if(tok) return reviewLoad(tok).then(render);
      return CLOUD.sb.auth.getSession().then(function(res){
        var ses=res.data&&res.data.session;
        if(!ses){ location.href='/login'; return; }
        var em=(ses.user.email||'').toLowerCase();
        return CLOUD.sb.from('app_users').select('is_admin,permissions').eq('email',em).maybeSingle().then(function(u){
          var row=u.data;
          if(!row||!(row.is_admin||(row.permissions||[]).indexOf('project_management')>=0)){ app.innerHTML=noAccess(em); return; }
          CLOUD.email=em; readLoad(); cloudUILoad();
          return cloudLoad().then(function(){ cloudLive(); render(); });
        });
      });
    }).catch(showCrash);
  }
  window.addEventListener('hashchange',function(){ var tk=reviewToken(); if(CLOUD&&tk&&(!RV||RV.token!==tk)){ reviewLoad(tk).then(render).catch(showCrash); return; } if(CLOUD&&!tk&&RV){ location.reload(); return; } render(); });
  window.addEventListener('storage',function(e){ if(e.key!==KEY||!e.newValue) return; try{ var o=JSON.parse(e.newValue); if(!o||!o.state) return; o.state.toasts=[]; var a=JSON.stringify(o.state), b=JSON.stringify(Object.assign({},S,{toasts:[]})); if(a===b) return; S=o.state; quiet=true; try{ render(); } finally{ quiet=false; } }catch(err){} });
  /* Emergency way out: opening the page with #reset clears the saved test data. */
  if(location.hash==='#reset'){ try{ localStorage.removeItem(KEY); localStorage.removeItem(KEY+'-ui'); }catch(e){} history.replaceState(null,'',location.pathname+location.search); }
  boot();
})();
</script>
